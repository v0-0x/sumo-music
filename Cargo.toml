[package]
name = "multimusic"
version = "0.6.1"
edition = "2021"
description = "A fast, lightweight, native music player for local files, Spotify and SoundCloud"
license = "MIT"
rust-version = "1.87"

[dependencies]
eframe = { version = "0.36", default-features = false, features = ["default_fonts", "glow", "wayland", "x11"] }
egui = "0.36"
egui-phosphor = { version = "0.14", features = ["regular", "fill"] }
librespot-core = { version = "0.8", default-features = false, features = ["native-tls"] }
librespot-playback = { version = "0.8", default-features = false, features = ["rodio-backend", "native-tls"] }
librespot-protocol = "0.8"
protobuf = "3"
http = "1"
lofty = "0.25"
rusqlite = { version = "0.40", features = ["bundled"] }
reqwest = { version = "0.13", default-features = false, features = ["native-tls", "http2", "charset", "gzip", "json", "form", "query"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "time", "net", "io-util", "process", "fs"] }
image = { version = "0.25", default-features = false, features = ["jpeg", "png", "webp"] }
walkdir = "2"
plist = "1"
directories = "6"
md-5 = "0.10"
regex = "1"
toml = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
anyhow = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
discord-rich-presence = "1"
rand = "0.9"
open = "5"
urlencoding = "2"
libc = "0.2"
memmap2 = "0.9"
sha2 = "0.10"
base64 = "0.22"
futures-util = "0.3"
raw-window-handle = "0.6"

# Windows and macOS: their media overlays and keys (souvlaki), and their file pickers (rfd).
[target.'cfg(any(windows, target_os = "macos"))'.dependencies]
souvlaki = { version = "0.8", default-features = false }
rfd = { version = "0.15", default-features = false }
pollster = "0.4"

# Linux: media controls (MPRIS), notifications and the file picker portal over D-Bus.
[target.'cfg(not(any(windows, target_os = "macos")))'.dependencies]
zbus = { version = "5", default-features = false, features = ["tokio"] }

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = [
    "Win32_Foundation",
    "Win32_Security",
    "Win32_System_JobObjects",
    "Win32_System_ProcessStatus",
    "Win32_System_Threading",
    "Win32_System_Time",
] }

[dev-dependencies]
tempfile = "3"

[features]
default = ["pulseaudio"]
# Spotify output through PulseAudio / PipeWire (pipewire-pulse). Without it Spotify
# plays through ALSA only.
pulseaudio = ["librespot-playback/pulseaudio-backend"]

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 4
strip = true

[profile.dev.package."*"]
opt-level = 2
